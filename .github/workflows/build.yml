name: Build and publish TZif files

on:
  workflow_dispatch:
  schedule:
    # Daily, 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download IANA tzdata
        run: |
          mkdir -p tzsrc zoneinfo public/zoneinfo

          curl -L -o tzdata-latest.tar.gz \
            "https://www.iana.org/time-zones/repository/tzdata-latest.tar.gz"

          tar -xzf tzdata-latest.tar.gz -C tzsrc

      - name: Compile TZif files
        run: |
          zic -d zoneinfo \
            tzsrc/africa \
            tzsrc/antarctica \
            tzsrc/asia \
            tzsrc/australasia \
            tzsrc/europe \
            tzsrc/northamerica \
            tzsrc/southamerica \
            tzsrc/etcetera \
            tzsrc/backward

      - name: Copy files to public directory
        run: |
          cp -a zoneinfo/. public/zoneinfo/

          refreshed_at_iso="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          refreshed_at_display="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"

          cat > public/index.html <<EOF
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>TZif files</title>
          </head>
          <body>
            <h1>TZif files</h1>
            <p>Last refreshed: <time datetime="$refreshed_at_iso">$refreshed_at_display</time></p>
            <p>Example: <a href="./zoneinfo/Europe/Amsterdam">Europe/Amsterdam</a></p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
